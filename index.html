<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Countdown to January 29</title>
<style>
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #111;
    color: #eee;
    font-family: system-ui, sans-serif;
  }
  .countdown {
    display: flex;
    gap: 2rem;
    text-align: center;
  }
  .unit {
    display: flex;
    flex-direction: column;
  }
  .value {
    font-size: 3rem;
    font-weight: 700;
  }
  .label {
    font-size: 0.9rem;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: #999;
  }
</style>
</head>
<body>

<div class="countdown">
  <div class="unit"><span class="value" id="months">0</span><span class="label">Months</span></div>
  <div class="unit"><span class="value" id="days">0</span><span class="label">Days</span></div>
  <div class="unit"><span class="value" id="hours">0</span><span class="label">Hours</span></div>
  <div class="unit"><span class="value" id="minutes">0</span><span class="label">Minutes</span></div>
</div>

<script>
function nextJan29() {
  const now = new Date();
  let target = new Date(now.getFullYear(), 0, 29, 0, 0, 0, 0);
  if (target <= now) {
    target = new Date(now.getFullYear() + 1, 0, 29, 0, 0, 0, 0);
  }
  return target;
}

function update() {
  const now = new Date();
  const target = nextJan29();

  let months = (target.getFullYear() - now.getFullYear()) * 12 + (target.getMonth() - now.getMonth());
  let months_date = new Date(now.getFullYear(), now.getMonth() + months, now.getDate(), now.getHours(), now.getMinutes(), now.getSeconds());
  if (months_date > target) {
    months--;
    months_date = new Date(now.getFullYear(), now.getMonth() + months, now.getDate(), now.getHours(), now.getMinutes(), now.getSeconds());
  }

  let remainingMs = target - months_date;
  const days = Math.floor(remainingMs / (1000 * 60 * 60 * 24));
  remainingMs -= days * (1000 * 60 * 60 * 24);
  const hours = Math.floor(remainingMs / (1000 * 60 * 60));
  remainingMs -= hours * (1000 * 60 * 60);
  const minutes = Math.floor(remainingMs / (1000 * 60));

  document.getElementById('months').textContent = months;
  document.getElementById('days').textContent = days;
  document.getElementById('hours').textContent = hours;
  document.getElementById('minutes').textContent = minutes;
}

update();
setInterval(update, 1000 * 30);
</script>

</body>
</html>
